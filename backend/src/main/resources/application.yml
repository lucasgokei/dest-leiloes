server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dest-leiloes-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/destleiloes}
    username: ${DATABASE_USER:destleiloes}
    password: ${DATABASE_PASSWORD:destleiloes}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        globally_quoted_identifiers: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

app:
  session-secret: ${SESSION_SECRET:troque-esta-chave-em-producao-gere-com-openssl-rand-base64-32}
  cookie-secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  seed:
    enabled: ${SEED_ENABLED:true}
